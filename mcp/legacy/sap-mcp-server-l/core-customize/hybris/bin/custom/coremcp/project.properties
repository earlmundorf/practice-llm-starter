# ---------------------------------------------------------------------------
# coremcp — MCP server extension for SAP Commerce
# ---------------------------------------------------------------------------

# Specifies the location of the spring context file added automatically to the global platform application context.
coremcp.application-context=coremcp-spring.xml

# Web module root — shares the OCC v2 servlet context
ext.coremcp.extension.webmodule.webroot=/occ/v2

# ---------------------------------------------------------------------------
# Operational defaults — override any of these in local.properties or via
# CCv2 Cloud Portal service properties. Values here are the shipped defaults.
# ---------------------------------------------------------------------------

# MCP session store: TTL (minutes since last access) and backing store.
# store=memory  — in-process ConcurrentHashMap (single-node; dev/test)
# store=persistent — DB-backed McpSessionEntry items (cluster-safe; CCv2)
coremcp.session.ttl.minutes=30
coremcp.session.store=persistent

# Agent loop bounds and tool-result summarization thresholds (chars).
coremcp.agent.maxToolIterations=10
coremcp.agent.toolResult.summaryThreshold=300
coremcp.agent.toolResult.summarySnippet=200

# Per-user rate limit for /agent/* endpoints (LLM calls cost real money).
# 0 disables rate limiting.
coremcp.agent.rateLimit.perMinute=20

# Max messages accepted in one /agent/chat request body.
coremcp.agent.maxMessagesPerRequest=50

# LLM HTTP behavior. Timeouts are per-request (seconds); retries apply to
# 429/500/502/503 and connection errors, with exponential backoff. Streaming
# responses are never retried once the first delta has been emitted.
coremcp.llm.timeout.seconds=60
coremcp.llm.stream.timeout.seconds=120
coremcp.llm.retry.maxAttempts=3
coremcp.llm.retry.baseDelayMillis=500

# Anthropic max_tokens per response.
coremcp.anthropic.maxTokens=1024

# Visual search: vision model, result cap, and max accepted base64 payload.
coremcp.visualsearch.model=gpt-4o
coremcp.visualsearch.maxResults=10
coremcp.visualsearch.maxImageBytes=10000000

# Knowledge search: hard ceiling on requested pageSize.
coremcp.knowledge.maxPageSize=50
