# ---------------------------------------------------------------------------
# ucpcommerce — UCP (Universal Commerce Protocol) surface for SAP Commerce
# ---------------------------------------------------------------------------

# Specifies the location of the spring context file added automatically to the global platform application context.
ucpcommerce.application-context=ucpcommerce-spring.xml

# Web module root — shares the OCC v2 servlet context (same mechanism as coremcp)
ext.ucpcommerce.extension.webmodule.webroot=/occ/v2

# ---------------------------------------------------------------------------
# Operational defaults — override any of these in local.properties or via
# CCv2 Cloud Portal service properties. Values here are the shipped defaults.
# ---------------------------------------------------------------------------

# Pinned UCP spec version (dated calver string, per the ucp-schema releases).
# The whole surface — profile, capability payloads, schema validation — is
# built against exactly this version; bumping it is a deliberate, reviewed
# change (see docs/adr/0001-ucp-as-dependent-extension-mcp-first.md).
ucpcommerce.ucp.version=2026-04-08

# UCP checkout session TTL (minutes since last access). Applies to
# UcpCheckoutSessionEntry rows (introduced in Phase 3): lazy eviction on
# access plus a cleanup cron for rows never touched again.
ucpcommerce.checkout.session.ttl.minutes=30

# Publicly reachable base URL advertised in the profile's transport endpoints
# (services.dev.ucp.shopping.mcp.endpoint, later rest). Must be the base a UCP
# client can actually reach — override for tunnel/edge-rewrite deployments.
ucpcommerce.public.base.url=https://localhost:9002
