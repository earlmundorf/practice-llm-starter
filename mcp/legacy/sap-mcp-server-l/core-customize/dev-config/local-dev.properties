###############################################################################
# CCv2 Development Environment Overrides
###############################################################################

# Database — set per environment in Cloud Portal or here
# db.url=jdbc:mysql://localhost:3306/hybris_mcp?useSSL=false&characterEncoding=utf8
# db.driver=com.mysql.cj.jdbc.Driver
# db.username=hybris
# db.password=hybris

# Logging
log4j2.logger.occ.level=DEBUG

# Backoffice hot-reload
backoffice.cockpitng.additionalResourceLoader.enabled=true
backoffice.cockpitng.uifactory.cache.enabled=false
backoffice.cockpitng.widgetclassloader.resourcecache.enabled=false

###############################################################################
# LLM provider samples
#
# The base local.properties defaults the agent to the 'openai' provider.
# To switch providers in development, uncomment ONE of the blocks below.
# API keys are NEVER written here — they must come from environment variables.
###############################################################################

# --- Direct OpenAI (default) ---
# Required env var: OPENAI_API_KEY
# Uncomment only if you need to change a value from the base defaults.
# coremcp.llm.provider=openai
# coremcp.openai.model=gpt-4o
# coremcp.openai.baseurl=

# --- Anthropic ---
# Required env var: ANTHROPIC_API_KEY
# coremcp.llm.provider=anthropic
# coremcp.anthropic.model=claude-3-5-sonnet-latest
# coremcp.anthropic.version=2023-06-01
# coremcp.anthropic.baseurl=

# --- OpenAI-compatible (Azure OpenAI, OpenRouter, Kong, LocalAI, vLLM, Together, ...) ---
# Required env var: OPENAI_COMPATIBLE_API_KEY
# baseurl is REQUIRED for this provider — replace the example below.
# coremcp.llm.provider=openai-compatible
# coremcp.openai-compatible.baseurl=https://your-gateway.example.com
# coremcp.openai-compatible.model=gpt-4o
# coremcp.openai-compatible.completions.path=/v1/chat/completions
