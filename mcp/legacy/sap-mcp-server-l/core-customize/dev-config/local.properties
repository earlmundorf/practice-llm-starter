###############################################################################
# Core
###############################################################################

installed.tenants=junit
initialpassword.admin=nimda

# Isolate data directory per project (prevents collisions when sharing platform symlinks)
# Uses HYBRIS_DATA_DIR env var, or falls back to a project-local directory.
# Set HYBRIS_DATA_DIR before starting to override (e.g., for CI).
hybris.data.dir=${HYBRIS_CONFIG_DIR}/../data
HYBRIS_LOG_DIR=${HYBRIS_CONFIG_DIR}/../log
HYBRIS_TEMP_DIR=${HYBRIS_CONFIG_DIR}/../temp/hybris

###############################################################################
# Database (MySQL 8.0 via Docker: docker run -d --name hybris-mysql -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=hybris -e MYSQL_USER=hybris -e MYSQL_PASSWORD=hybris -p 3306:3306 mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci)
###############################################################################

db.url=jdbc:mysql://localhost:3306/hybris_mcp?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
db.driver=com.mysql.cj.jdbc.Driver
db.username=hybris
db.password=hybris
db.tableprefix=

mysql.optional.tabledefs=CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci
mysql.tabletype=InnoDB
mysql.allow.fractional.seconds=true

###############################################################################
# Tomcat / ports
###############################################################################

tomcat.http.port=9001
tomcat.ssl.port=9002
tomcat.ssl.enabled=true

###############################################################################
# JVM (safe local defaults)
###############################################################################

tomcat.generaloptions=-Xms2g -Xmx6g -XX:+UseG1GC -Djava.io.tmpdir=/private/tmp

###############################################################################
# OCC / Webservices
###############################################################################

# Make sure OCC and OAuth URLs resolve correctly behind SSL
webservices.webroot=/occ
oauth2.webroot=/authorizationserver


###############################################################################
# Swagger
###############################################################################

swagger.documentation.enabled=true

###############################################################################
# CORS (required for React / Spartacus / browser-based clients)
###############################################################################

corsfilter.acceleratorocc.allowedOrigins=http://localhost:3000,http://localhost:4200,http://localhost:5173
corsfilter.acceleratorocc.allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
corsfilter.acceleratorocc.allowedHeaders=origin,content-type,accept,authorization,mcp-session-id,mcp-protocol-version
corsfilter.acceleratorocc.exposedHeaders=mcp-session-id
corsfilter.acceleratorocc.allowCredentials=true

###############################################################################
# MCP / Agent (OpenAI)
###############################################################################

coremcp.openai.model=gpt-4o
# coremcp.openai.apikey — set in CCv2 Cloud Portal per environment, or OPENAI_API_KEY env var locally

###############################################################################
# Backoffice
###############################################################################

backoffice.solr.search.index.autoinit=false
backoffice.cockpitng.additionalResourceLoader.enabled=true
backoffice.cockpitng.uifactory.cache.enabled=false
backoffice.cockpitng.widgetclassloader.resourcecache.enabled=false


###############################################################################
# Logging sanity (optional but helpful)
###############################################################################

log4j2.logger.occ.name=de.hybris.platform.commercewebservices
log4j2.logger.occ.level=INFO

tomcat.wrapper.enabled=true
tomcat.useWrapper=true
# -Djava.io.tmpdir in tomcat.generaloptions: macOS /var -> /private/var symlink breaks backoffice SafeZipEntry validation
tomcat.javaoptions=-Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
